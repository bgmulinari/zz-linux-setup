id = "media-cliamp"
description = "cliamp terminal music player from its Homebrew tap"

[choice]
category = "media"
id = "cliamp"
label = "cliamp"
default = true
order = 30
description = "Retro terminal music player for local files, radio, podcasts, and streaming services"

# The tap formula ships no bottle, so Homebrew classifies it as a source build
# and refuses to proceed without a C compiler on PATH, even though its install
# step only copies the prebuilt release binary. Fedora's gcc satisfies that
# check; nothing is actually compiled.
[[install]]
backend = "dnf"
packages = ["gcc"]

[[install]]
backend = "action"
sources = ["artifact:homebrew"]
actions = ["brew:bjarneo/cliamp/cliamp"]
