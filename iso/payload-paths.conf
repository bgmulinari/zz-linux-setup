# Runtime paths included in embedded and remotely refreshed ISO payloads.
# iso/lib/runtime-loader.sh and this manifest ride along so the embedded
# payload can refresh itself from inside Anaconda.
#
# The snapshot only feeds the choice catalogs and the revision marker; the
# add-on installs from a fresh clone of that revision. Large asset trees such
# as the wallpapers are deliberately left out so the embedded payload stays
# small; .gitattributes export-ignore keeps them out of the remote tarball too.
